name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: alchamentry
  NODE_VERSION: "22"

jobs:
  # Every push to main goes to the production branch of the alchamentry Pages
  # project, which is the branch alchamentry.com is attached to.
  deploy:
    name: Production
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.publish.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check Cloudflare credentials
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error title=CLOUDFLARE_API_TOKEN is not set::Create an API token with the 'Cloudflare Pages: Edit' permission and add it as a repository secret. See README.md, Deployment."
            exit 1
          fi

      - name: Build
        run: node scripts/build.mjs

      - name: Publish
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }} --branch=main

      - name: Job summary
        run: |
          {
            echo "### alchamentry.com"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Deployment | ${{ steps.publish.outputs.deployment-url }} |"
            echo "| Alias | ${{ steps.publish.outputs.pages-deployment-alias-url }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Pull requests get their own preview URL on the same project.
  preview:
    name: Preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check Cloudflare credentials
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error title=CLOUDFLARE_API_TOKEN is not set::Create an API token with the 'Cloudflare Pages: Edit' permission and add it as a repository secret. See README.md, Deployment."
            exit 1
          fi

      - name: Build
        run: node scripts/build.mjs

      - name: Publish preview
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }} --branch=${{ github.head_ref }}

      - name: Comment the preview URL on the pull request
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- alchamentry-pages-preview -->';
            const body = [
              marker,
              `**Preview:** ${process.env.PREVIEW_URL}`,
              '',
              `Commit: \`${context.payload.pull_request.head.sha}\``,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
